<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ironlog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@500;700&display=swap">
<style>
:root{--bg:#eceef5;--card:#fff;--ink:#14161f;--mute:#6a7088;--line:#dcdfeb;--acc:#9aa3b5;--on:#14161f;--f1:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--f2:Barlow,"Segoe UI",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10121a;--card:#1a1d29;--ink:#f2f3f8;--mute:#8d93ab;--line:#2a2e40}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--hg,none)}
.streak+.streak{margin-left:8px}
.pc{display:inline-flex;align-items:center;justify-content:center;width:46px;height:64px;border-radius:9px;background:#fff;color:#14161f;font:800 21px var(--f1);margin:6px 5px 0 0;border:1px solid var(--line);padding:0}
.pc.r{color:#d92d4a}.pc.back{background:var(--acc);color:var(--on)}.pc.hold{outline:3px solid var(--acc);transform:translateY(-8px)}
.row2{display:flex;gap:8px}.row2 .btn{margin-top:12px}
.ct{background:var(--bg);border:2px solid;border-radius:12px;padding:8px 4px;text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
body{margin:0 auto;background:var(--bg);color:var(--ink);font-family:var(--f2);font-weight:500;max-width:520px;padding-bottom:92px;min-height:100vh}
h1,h2,h3,.f1{font-family:var(--f1);font-weight:800;margin:0;letter-spacing:.01em}
h3{font-size:22px}
button,input,select{font:inherit}
button{cursor:pointer;border:0;color:inherit}
.hero{margin:14px 16px 0;padding:18px;border-radius:26px;background:var(--card);border:1px solid var(--line);display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--acc)}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 30px var(--f1)}
.rname{font:800 34px/0.95 var(--f1);color:var(--acc)}
.sub{color:var(--mute);font-size:14px;margin-top:6px}
.streak{display:inline-flex;gap:6px;align-items:center;margin-top:10px;background:var(--bg);border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:14px 16px 0;padding:16px}
.lbl{font-size:13px;color:var(--mute);margin-bottom:6px;display:block}
.pick{position:relative;display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.pick .f1{font-size:36px;line-height:1}
.pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.tag{display:inline-block;background:var(--acc);color:var(--on);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:700;margin-top:6px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stp{background:var(--bg);border-radius:16px;padding:10px}
.stp div{display:flex;align-items:center;gap:4px}
.stp button{width:44px;height:48px;border-radius:12px;background:var(--card);font:800 26px var(--f1);flex:none;border:1px solid var(--line)}
.stp input{width:100%;min-width:0;text-align:center;background:none;border:0;color:var(--ink);font:800 34px var(--f1);padding:0}
.stp input:focus{outline:2px solid var(--acc);border-radius:8px}
.btn{display:block;width:100%;margin-top:14px;padding:16px;border-radius:16px;background:var(--acc);color:var(--on);font:800 21px var(--f1);text-align:center;letter-spacing:.03em}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn:active{transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:700}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.set .n{font:800 26px var(--f1)}
.set small{color:var(--mute);font-size:13px}
.pr{background:#ff4d3d;color:#fff;border-radius:6px;padding:1px 7px;font:800 13px var(--f1);margin-left:8px}
.x{background:none;color:var(--mute);font-size:24px;padding:4px 8px}
input[type=text]{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
select.plain{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;color:var(--mute);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px}
.tabs button.on{color:var(--ink);background:var(--bg)}
.tabs button.on svg{stroke:var(--acc)}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{height:10px;border-radius:9px;background:var(--bg);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lad{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.lad:last-child{border:0}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 20px var(--f1);color:#14161f;flex:none}
.muted{color:var(--mute);font-size:14px}
.empty{color:var(--mute);text-align:center;padding:20px 0}
.modal{position:fixed;inset:0;background:rgba(8,9,14,.78);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .card{margin:0;width:100%;max-width:400px;text-align:center}
.grade{font:800 120px/1 var(--f1);color:var(--acc)}
video{width:100%;border-radius:14px;margin-top:8px;background:#000}
summary{font:800 20px var(--f1);cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block;margin-bottom:6px;border:4px solid var(--fr,transparent)}
.fx{position:fixed;top:-40px;z-index:30;pointer-events:none;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fx{display:none}}
textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabs" id="tabs"></div>
<div id="md"></div>
<script>
var EX={Chest:["Bench Press","Incline Dumbbell Press","Chest Fly","Push-Up","Dips"],Back:["Deadlift","Barbell Row","Pull-Up","Lat Pulldown","Seated Cable Row"],Shoulders:["Overhead Press","Lateral Raise","Face Pull","Rear Delt Fly"],Biceps:["Barbell Curl","Dumbbell Curl","Hammer Curl"],Triceps:["Tricep Pushdown","Skull Crusher","Overhead Extension"],Legs:["Squat","Leg Press","Romanian Deadlift","Lunge","Leg Curl","Leg Extension","Calf Raise"],Core:["Cable Crunch","Hanging Leg Raise"]};
var BASE={};Object.keys(EX).forEach(function(g){EX[g].forEach(function(e){BASE[e]=g})});
var RANKS=[["Pre Cum",0,"#9aa3b5"],["Bronze Beater",500,"#cd7f32"],["Silver Stroker",1500,"#c9d1dc"],["Golden Gooner",3500,"#f5b83d"],["Emerald Edger",7000,"#2fd18b"],["Platinum Puller",12000,"#6fdcff"],["Grandmaster Baiter",20000,"#ff4fb0"]];
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var ICON=["<path d='M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12'/>","<rect x='4' y='5' width='16' height='15' rx='2'/><path d='M4 10h16M9 3v4M15 3v4'/>","<circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 2'/>","<circle cx='9' cy='9' r='3'/><path d='M3 20c0-3 3-5 6-5s6 2 6 5M17 6a3 3 0 010 6M21 19c0-2-1-4-3-4.5'/>","<path d='M8 4h8v5a4 4 0 01-8 0zM8 6H4v1a3 3 0 004 3M16 6h4v1a3 3 0 01-4 3M12 13v4M8 20h8'/>","<rect x='5' y='11' width='14' height='9' rx='2'/><path d='M8 11V8a4 4 0 018 0v3'/>","<ellipse cx='12' cy='13' rx='6' ry='8'/><path d='M9 9c2 1 4 1 6 0'/>"];
var NAMES=["Workout","Plan","History","Friends","Rank","Lock","Nuts"];
var S={unit:"lb",hist:[],cur:[],custom:{},routines:[],lock:{on:true,apps:[],need:10},prof:{bw:0,by:0,log:[]},rec:{},bumped:{},nuts:0,owned:{},bg:"none",freezes:0,boost:0,flair:"",hol:true,note:"",accent:"rank",frame:"none",fx:"",pass:"",dbl:0},T=0,last="Bench Press",W=45,R=8,rn="",draft=[],dd=[],clips=[],db=null;
var DB=null,USER=null,ME=null,fr=[],stats={},pn={},hits=[],ft=null;
try{var d0=JSON.parse(localStorage.getItem("ironlog"));if(d0){for(var k in d0)S[k]=d0[k]}}catch(e){}
function save(){try{localStorage.setItem("ironlog",JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function mg(ex){return BASE[ex]||S.custom[ex]||"Core"}
function groups(){var g={};Object.keys(EX).forEach(function(k){g[k]=EX[k].slice()});Object.keys(S.custom).forEach(function(n){g[S.custom[n]].push(n)});return g}
function opts(sel){var g=groups();return Object.keys(g).map(function(k){return '<optgroup label="'+k+'">'+g[k].map(function(e){return '<option'+(e===sel?' selected':'')+'>'+esc(e)+'</option>'}).join("")+'</optgroup>'}).join("")}
function xp(s){return Math.round(s.w*s.r/10*(s.f||1))}
function e1(s){return s.w*(1+s.r/30)}
function rank(x,k){k=k||1;var i=0;RANKS.forEach(function(r,n){if(x>=r[1]/k)i=n});var a=RANKS[i][1]/k,b=RANKS[i+1]?RANKS[i+1][1]/k:null;return{i:i,name:RANKS[i][0],col:RANKS[i][2],pct:b?Math.min(100,(x-a)/(b-a)*100):100,next:b?RANKS[i+1][0]:null,need:b?Math.ceil(b-x):0}}
function totals(){var t=0,m={};S.hist.forEach(function(w){w.sets.forEach(function(s){var v=xp(s);t+=v;m[mg(s.ex)]=(m[mg(s.ex)]||0)+v})});return{t:t,m:m}}
function grade(x){return x>=1500?"S":x>=1000?"A":x>=600?"B":x>=300?"C":"D"}
function best(ex){var b=0;S.hist.concat([{sets:S.cur}]).forEach(function(w){w.sets.forEach(function(s){if(s.ex===ex)b=Math.max(b,e1(s))})});return b}
function dk(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function streaks(){var set={},d=new Date(),c=0,days=[];S.hist.forEach(function(w){var x=new Date(w.date);x.setHours(12,0,0,0);var k=dk(x);if(!set[k]){set[k]=1;days.push(x.getTime())}});
var fz=S.frozen||{};if(!set[dk(d)])d.setDate(d.getDate()-1);while(set[dk(d)]||fz[dk(d)]){if(set[dk(d)])c++;d.setDate(d.getDate()-1)}
var all=days.map(function(t){return[t,1]});Object.keys(fz).forEach(function(k){var q=k.split("-");all.push([new Date(+q[0],+q[1]-1,+q[2],12).getTime(),0])});all.sort(function(a,b){return a[0]-b[0]});var b=0,run=0,p=0;all.forEach(function(e){var t=e[0];run=(p&&Math.round((t-p)/864e5)===1)?run+e[1]:e[1];if(run>b)b=run;p=t});return{cur:c,best:b}}
function tab(n){stopCrash();T=n;draw();window.scrollTo(0,0)}
function stp(k,d){var el=document.getElementById(k),v=(parseFloat(el.value)||0)+d;if(v<0)v=0;el.value=v;if(k==="w")W=v;else R=v}
function add(){var s={ex:last,w:W,r:Math.round(R),f:fx()};if(!(s.w>=0)||!(s.r>0)){alert("Set the reps first.");return}
var b=best(last);if(b>0&&e1(s)>b)s.pr=1;S.cur.push(s);save();draw()}
function del(i){S.cur.splice(i,1);save();draw()}
function setUnit(u){S.unit=u;save();draw()}
function pick(e){last=e;if(S.rec[e])W=S.rec[e];T=0;draw()}
function addCustom(){var n=document.getElementById("cn").value.trim(),g=document.getElementById("cg").value;if(!n){alert("Name your exercise first.");return}
if(BASE[n]||S.custom[n]){alert("That exercise already exists.");return}S.custom[n]=g;last=n;save();draw()}
function addDraft(){var e=document.getElementById("rx").value;if(draft.indexOf(e)<0)draft.push(e);draw()}
function togDay(i){var p=dd.indexOf(i);if(p<0)dd.push(i);else dd.splice(p,1);draw()}
function saveRt(){if(!rn.trim()||!draft.length){alert("Give the routine a name and add at least one exercise.");return}
S.routines.push({name:rn.trim(),ex:draft,days:dd});rn="";draft=[];dd=[];save();draw()}
function delRt(i){S.routines.splice(i,1);save();draw()}
function idb(cb){try{var q=indexedDB.open("ironlog",1);q.onupgradeneeded=function(){q.result.createObjectStore("c",{keyPath:"id"})};
q.onsuccess=function(){db=q.result;try{db.transaction("c").objectStore("c").getAll().onsuccess=function(e){clips=e.target.result.sort(function(a,b){return b.id-a.id});cb()}}catch(x){cb()}};q.onerror=cb}catch(e){cb()}}
function rec(inp){var f=inp.files[0];if(!f)return;var r={id:Date.now(),ex:last,date:new Date().toISOString(),blob:f};clips.unshift(r);
try{db.transaction("c","readwrite").objectStore("c").put(r)}catch(e){}T=2;draw()}
function delClip(id){clips=clips.filter(function(c){return c.id!==id});try{db.transaction("c","readwrite").objectStore("c").delete(id)}catch(e){}draw()}
function finish(){if(!S.cur.length)return;var before=rank(totals().t).name,sets=S.cur,x=0,m={},prs=0;
sets.forEach(function(s){var v=xp(s);x+=v;m[mg(s.ex)]=(m[mg(s.ex)]||0)+v;if(s.pr)prs++});
S.hist.unshift({date:new Date().toISOString(),sets:sets});S.cur=[];seedRec(sets);S.boost=0;var bm=weekBump();save();sync();
var rr=rank(totals().t),g=grade(x),st=streaks().cur;var nt=(10+Math.floor(x/25)+5*prs+Math.min(st,10))*(S.dbl?2:1);S.dbl=0;S.nuts=(S.nuts||0)+nt;save();
var rows=Object.keys(m).map(function(k){return '<div class="rw set"><span>'+k+'</span><b>+'+m[k]+' XP</b></div>'}).join("");
document.getElementById("md").innerHTML='<div class="modal"><div class="card"><div class="muted">Workout grade</div><div class="grade">'+g+'</div><h2 style="font-size:32px">'+x+' XP earned</h2><div class="muted">'+sets.length+' sets'+(prs?' · '+prs+' new PR'+(prs>1?'s':''):'')+' · '+st+' day streak</div>'+(S.lock.on&&S.lock.apps.length?'<div class="muted" style="margin-top:6px">'+(unlocked()?'Your locked apps are open until midnight.':(S.lock.need-doneToday())+' more sets to unlock your apps.')+'</div>':'')+rows+'<div class="rname" style="margin-top:16px">'+(before===rr.name?rr.name:before+' to '+rr.name)+'</div>'+'<div class="rname" style="font-size:28px;margin-top:10px">+'+nt+' nuts</div>'+bm+'<label class="btn ghost" style="font-size:18px">Add a progress photo<input type="file" accept="image/*" hidden onchange="addPhoto(this)"></label><button class="btn" onclick="document.getElementById(\'md\').innerHTML=\'\';tab(4)">See my rank</button></div></div>';fxRain();draw()}
var PRE=["Instagram","TikTok","YouTube","Snapchat","X","Facebook","Reddit","Discord","Netflix","Twitch","Roblox","Fortnite","Minecraft","Call of Duty"];
function doneToday(){var n=0,k=dk(new Date());S.hist.forEach(function(w){if(dk(new Date(w.date))===k)n+=w.sets.length});return n}
function unlocked(){return !S.lock.on||doneToday()>=S.lock.need||S.pass===dk(new Date())}
function togApp(a){var i=S.lock.apps.indexOf(a);if(i<0)S.lock.apps.push(a);else S.lock.apps.splice(i,1);save();draw()}
function addApp(){var n=document.getElementById("la").value.trim();if(!n)return;if(S.lock.apps.indexOf(n)<0)S.lock.apps.push(n);save();draw()}
function setNeed(n){S.lock.need=n;save();draw()}
function togLock(){S.lock.on=!S.lock.on;save();draw()}
function age(){return S.prof.by?new Date().getFullYear()-S.prof.by:0}
function bwShow(lb){return S.unit==="kg"?Math.round(lb/2.2046*10)/10:Math.round(lb*10)/10}
function fac(){var p=S.prof;if(!p.bw||!p.by)return 1;var b=Math.min(1.6,Math.max(.6,Math.pow(180/p.bw,.66))),a=age(),g=a<20?1+(20-a)*.02:a>35?Math.min(1.8,1+(a-35)*.012):1;return Math.round(b*g*1000)/1000}
function needWeigh(){var p=S.prof;if(!p.bw||!p.by)return"setup";var l=p.log.length?p.log[p.log.length-1].date:null;return(!l||Date.now()-new Date(l).getTime()>30*864e5)?"monthly":""}
function weighModal(mode){var p=S.prof,su=mode==="setup";document.getElementById("md").innerHTML='<div class="modal"><div class="card" style="text-align:left"><h3>'+(su?'Your stats':'Monthly weigh-in')+'</h3><p class="muted">'+(su?'Your rank is judged on your weight and age, so lighter and older lifters get a fair shot. This stays on your phone.':'It has been a month. Step on the scale and enter your weight so your rank stays accurate.')+'</p><span class="lbl">Weight ('+S.unit+')</span><input id="pw" type="text" inputmode="decimal" value="'+(p.bw?bwShow(p.bw):'')+'">'+(su?'<span class="lbl" style="margin-top:10px">Age</span><input id="pa" type="text" inputmode="numeric" value="'+(p.by?age():'')+'">':'')+'<button class="btn" onclick="saveProf()">SAVE</button><button class="btn ghost" onclick="document.getElementById(\'md\').innerHTML=\'\'">Not now</button></div></div>'}
function saveProf(){var w=parseFloat(document.getElementById("pw").value),ae=document.getElementById("pa"),a=ae?parseInt(ae.value,10):0;if(!(w>20)||(ae&&!(a>=10&&a<=99))){alert("Enter a real weight"+(ae?" and an age from 10 to 99":"")+".");return}var lb=S.unit==="kg"?w*2.2046:w;S.prof.bw=lb;if(ae)S.prof.by=new Date().getFullYear()-a;S.prof.log.push({date:new Date().toISOString(),bw:lb});save();document.getElementById("md").innerHTML="";draw()}
var pend=null,pe=0,imp="";
function of(k){return clips.filter(function(c){return(c.kind||"clip")===k})}
function put(r){try{db.transaction("c","readwrite").objectStore("c").put(r)}catch(e){}}
function closeMd(){document.getElementById("md").innerHTML=""}
function selEx(v){last=v;if(S.rec[v])W=S.rec[v];draw()}
function seedRec(sets){sets.forEach(function(s){if(!S.rec[s.ex]){var m=0;sets.forEach(function(t){if(t.ex===s.ex&&t.w>m)m=t.w});S.rec[s.ex]=m}})}
function wk(d){var x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return dk(x)}
function weekBump(){var cur=wk(new Date()),inc=S.unit==="kg"?2.5:5,out=[],did={};S.routines.forEach(function(r){if(!r.days.length)return;var key=r.name+"|"+cur;if(S.bumped[key])return;var days={};S.hist.forEach(function(w){if(wk(w.date)!==cur)return;var have={};w.sets.forEach(function(s){have[s.ex]=1});if(r.ex.every(function(e){return have[e]}))days[dk(new Date(w.date))]=1});
if(Object.keys(days).length>=r.days.length){S.bumped[key]=1;r.ex.forEach(function(e){if(!did[e]){did[e]=1;S.rec[e]=(S.rec[e]||0)+inc}});out.push(r.name)}});save();return out.length?'<div class="card" style="margin:12px 0 0;border-color:var(--acc)"><b>Week complete: '+out.map(esc).join(", ")+'</b><div class="muted">Recommended weights go up '+inc+' '+S.unit+' for next week.</div></div>':''}
